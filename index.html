<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakpoint</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Breakpoint: Learn Engineering Terms</h1>

    <div class="topbuttons">
        <a href="howtoplay.html">How to Play</a>
        <button id="restartbutton">Restart</button>
    </div>    

    <div class="container">
        <div class="left">
            <div id="attempts">Attempts Left: </div>

            <div id="guessword"></div>

            <input
                type="text"
                id="input"
                placeholder="Enter a letter"
                autofocus
            >

            <button id="guessbutton">Guess</button>

            <div id="wrongguess">Wrong Guesses: </div>

            <div id="description">Description: </div>

            <div id="result">Result: </div>
        </div>

        
        <div class="bridgehangman">

            <svg
                viewBox="0 0 600 380"
                xmlns="http://www.w3.org/2000/svg"
            >

                <!-- =====================================================
                    REUSABLE BRIDGE PARTS
                    ===================================================== -->
                <defs>

                    <!-- LEFT FOUNDATION -->
                    <g id="leftFoundation">
                        <line x1="180" y1="245" x2="180" y2="300"
                            stroke="currentColor" stroke-width="3"/>
                        <line x1="220" y1="245" x2="220" y2="300"
                            stroke="currentColor" stroke-width="3"/>
                        <line x1="180" y1="300" x2="220" y2="300"
                            stroke="currentColor" stroke-width="3"/>
                        <rect x="165" y="300" width="70" height="15"
                            fill="none" stroke="currentColor" stroke-width="3"/>
                    </g>

                    <!-- RIGHT FOUNDATION -->
                    <g id="rightFoundation">
                        <line x1="380" y1="245" x2="380" y2="300"
                            stroke="currentColor" stroke-width="3"/>
                        <line x1="420" y1="245" x2="420" y2="300"
                            stroke="currentColor" stroke-width="3"/>
                        <line x1="380" y1="300" x2="420" y2="300"
                            stroke="currentColor" stroke-width="3"/>
                        <rect x="365" y="300" width="70" height="15"
                            fill="none" stroke="currentColor" stroke-width="3"/>
                    </g>

                    <!-- LEFT TOWER -->
                    <g id="leftTower">

                        <rect x="175" y="55" width="10" height="175"
                            fill="none" stroke="currentColor" stroke-width="3"/>
                        <rect x="215" y="55" width="10" height="175"
                            fill="none" stroke="currentColor" stroke-width="3"/>

                        <line x1="175" y1="65" x2="225" y2="65"
                            stroke="currentColor" stroke-width="3"/>
                        <line x1="175" y1="78" x2="225" y2="78"
                            stroke="currentColor" stroke-width="2"/>

                        <line x1="185" y1="100" x2="215" y2="100"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="185" y1="125" x2="215" y2="125"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="185" y1="160" x2="215" y2="160"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="185" y1="195" x2="215" y2="195"
                            stroke="currentColor" stroke-width="2"/>

                        <line x1="185" y1="100" x2="215" y2="125"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="215" y1="100" x2="185" y2="125"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="185" y1="125" x2="215" y2="160"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="215" y1="125" x2="185" y2="160"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="185" y1="160" x2="215" y2="195"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="215" y1="160" x2="185" y2="195"
                            stroke="currentColor" stroke-width="2"/>

                    </g>

                    <!-- RIGHT TOWER -->
                    <g id="rightTower">

                        <rect x="375" y="55" width="10" height="175"
                            fill="none" stroke="currentColor" stroke-width="3"/>
                        <rect x="415" y="55" width="10" height="175"
                            fill="none" stroke="currentColor" stroke-width="3"/>

                        <line x1="375" y1="65" x2="425" y2="65"
                            stroke="currentColor" stroke-width="3"/>
                        <line x1="375" y1="78" x2="425" y2="78"
                            stroke="currentColor" stroke-width="2"/>

                        <line x1="385" y1="100" x2="415" y2="100"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="385" y1="125" x2="415" y2="125"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="385" y1="160" x2="415" y2="160"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="385" y1="195" x2="415" y2="195"
                            stroke="currentColor" stroke-width="2"/>

                        <line x1="385" y1="100" x2="415" y2="125"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="415" y1="100" x2="385" y2="125"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="385" y1="125" x2="415" y2="160"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="415" y1="125" x2="385" y2="160"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="385" y1="160" x2="415" y2="195"
                            stroke="currentColor" stroke-width="2"/>
                        <line x1="415" y1="160" x2="385" y2="195"
                            stroke="currentColor" stroke-width="2"/>

                    </g>

                    <!-- LEFT DECK -->
                    <g id="leftDeck">

                        <line x1="15" y1="230" x2="175" y2="230"
                            stroke="currentColor" stroke-width="3"/>
                        <line x1="15" y1="245" x2="175" y2="245"
                            stroke="currentColor" stroke-width="3"/>

                        <g stroke="currentColor" stroke-width="1.5">
                            <line x1="40" y1="230" x2="40" y2="245"/>
                            <line x1="70" y1="230" x2="70" y2="245"/>
                            <line x1="100" y1="230" x2="100" y2="245"/>
                            <line x1="130" y1="230" x2="130" y2="245"/>
                            <line x1="160" y1="230" x2="160" y2="245"/>
                        </g>

                    </g>

                    <!-- CENTER DECK -->
                    <g id="centerDeck">

                        <line x1="175" y1="230" x2="375" y2="230"
                            stroke="currentColor" stroke-width="3"/>
                        <line x1="175" y1="245" x2="375" y2="245"
                            stroke="currentColor" stroke-width="3"/>

                        <g stroke="currentColor" stroke-width="1.5">
                            <line x1="190" y1="230" x2="190" y2="245"/>
                            <line x1="220" y1="230" x2="220" y2="245"/>
                            <line x1="250" y1="230" x2="250" y2="245"/>
                            <line x1="280" y1="230" x2="280" y2="245"/>
                            <line x1="310" y1="230" x2="310" y2="245"/>
                            <line x1="340" y1="230" x2="340" y2="245"/>
                        </g>

                    </g>

                    <!-- RIGHT DECK -->
                    <g id="rightDeck">

                        <line x1="375" y1="230" x2="585" y2="230"
                            stroke="currentColor" stroke-width="3"/>
                        <line x1="375" y1="245" x2="585" y2="245"
                            stroke="currentColor" stroke-width="3"/>

                        <g stroke="currentColor" stroke-width="1.5">
                            <line x1="400" y1="230" x2="400" y2="245"/>
                            <line x1="430" y1="230" x2="430" y2="245"/>
                            <line x1="460" y1="230" x2="460" y2="245"/>
                            <line x1="490" y1="230" x2="490" y2="245"/>
                            <line x1="520" y1="230" x2="520" y2="245"/>
                            <line x1="550" y1="230" x2="550" y2="245"/>
                        </g>

                    </g>

                    <!-- LEFT CABLE -->
                    <g id="leftCable">

                        <path d="M 15 225
                            C 75 205, 125 170, 175 120
                            C 190 105, 205 90, 220 75"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"/>

                        <g stroke="currentColor" stroke-width="1.5">
                            <line x1="45" y1="215" x2="45" y2="230"/>
                            <line x1="75" y1="202" x2="75" y2="230"/>
                            <line x1="105" y1="185" x2="105" y2="230"/>
                            <line x1="135" y1="164" x2="135" y2="230"/>
                            <line x1="160" y1="140" x2="160" y2="230"/>
                            <line x1="180" y1="115" x2="180" y2="230"/>
                        </g>

                    </g>

                    <!-- RIGHT CABLE -->
                    <g id="rightCable">

                        <path d="M 380 75
                            C 395 90, 410 105, 425 120
                            C 475 170, 525 205, 585 225"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"/>

                        <g stroke="currentColor" stroke-width="1.5">
                            <line x1="420" y1="115" x2="420" y2="230"/>
                            <line x1="440" y1="140" x2="440" y2="230"/>
                            <line x1="465" y1="164" x2="465" y2="230"/>
                            <line x1="495" y1="185" x2="495" y2="230"/>
                            <line x1="525" y1="202" x2="525" y2="230"/>
                            <line x1="555" y1="215" x2="555" y2="230"/>
                        </g>

                    </g>

                </defs>


                <!-- =====================================================
                    START — PERFECTLY INTACT BRIDGE
                    ===================================================== -->
                <g id="bridgeStart">

                    <use href="#leftFoundation"/>
                    <use href="#rightFoundation"/>

                    <use href="#leftTower"/>
                    <use href="#rightTower"/>

                    <use href="#leftDeck"/>
                    <use href="#centerDeck"/>
                    <use href="#rightDeck"/>

                    <use href="#leftCable"/>
                    <use href="#rightCable"/>

                </g>


                <!-- =====================================================
                    MISTAKE 1 — LEFT OUTER DECK FALLS
                    ===================================================== -->
                <g id="mistake1" style="display:none">

                    <use href="#leftFoundation"/>
                    <use href="#rightFoundation"/>

                    <use href="#leftTower"/>
                    <use href="#rightTower"/>

                    <use href="#centerDeck"/>
                    <use href="#rightDeck"/>

                    <use href="#leftCable"/>
                    <use href="#rightCable"/>

                    <!-- fallen left deck -->
                    <use
                        href="#leftDeck"
                        transform="translate(-15 65) rotate(-12 90 230)"
                    />

                </g>


                <!-- =====================================================
                    MISTAKE 2 — RIGHT OUTER DECK FALLS TOO
                    ===================================================== -->
                <g id="mistake2" style="display:none">

                    <use href="#leftFoundation"/>
                    <use href="#rightFoundation"/>

                    <use href="#leftTower"/>
                    <use href="#rightTower"/>

                    <use href="#centerDeck"/>

                    <use href="#leftCable"/>
                    <use href="#rightCable"/>

                    <!-- fallen left deck -->
                    <use
                        href="#leftDeck"
                        transform="translate(-15 65) rotate(-12 90 230)"
                    />

                    <!-- fallen right deck -->
                    <use
                        href="#rightDeck"
                        transform="translate(20 95) rotate(13 480 230)"
                    />

                </g>


                <!-- =====================================================
                    MISTAKE 3 — LEFT TOWER COLLAPSES
                    ===================================================== -->
                <g id="mistake3" style="display:none">

                    <use href="#leftFoundation"/>
                    <use href="#rightFoundation"/>

                    <!-- right tower still standing -->
                    <use href="#rightTower"/>

                    <!-- center deck still standing -->
                    <use href="#centerDeck"/>
                    
                    <!-- right cable -->
                    <use href="#rightCable"/>

                    <!-- fallen left deck -->
                    <use
                        href="#leftDeck"
                        transform="translate(-15 65) rotate(-12 90 230)"
                    />

                    <!-- fallen left tower -->
                    <use
                        href="#leftTower"
                        transform="translate(-65 70) rotate(-23 200 230)"
                    />

                    <!-- fallen right deck -->
                    <use
                        href="#rightDeck"
                        transform="translate(20 95) rotate(13 480 230)"
                    />

                </g>


                <!-- =====================================================
                    MISTAKE 4 — RIGHT TOWER COLLAPSES
                    ===================================================== -->
                <g id="mistake4" style="display:none">

                    <use href="#leftFoundation"/>
                    <use href="#rightFoundation"/>

                    <!-- only center deck remains standing -->
                    <use href="#centerDeck"/>

                    <!-- fallen left tower -->
                    <use
                        href="#leftTower"
                        transform="translate(-65 70) rotate(-23 200 230)"
                    />

                    <!-- fallen right tower -->
                    <use
                        href="#rightTower"
                        transform="translate(65 70) rotate(23 400 230)"
                    />

                    <!-- fallen left deck -->
                    <use
                        href="#leftDeck"
                        transform="translate(-15 65) rotate(-12 90 230)"
                    />

                    <!-- fallen right deck -->
                    <use
                        href="#rightDeck"
                        transform="translate(20 95) rotate(13 480 230)"
                    />

                </g>


                <!-- =====================================================
                    MISTAKE 5 — CENTER DECK FALLS
                    ===================================================== -->
                <g id="mistake5" style="display:none">

                    <use href="#leftFoundation"/>
                    <use href="#rightFoundation"/>

                    <!-- fallen left tower -->
                    <use
                        href="#leftTower"
                        transform="translate(-65 70) rotate(-23 200 230)"
                    />

                    <!-- fallen right tower -->
                    <use
                        href="#rightTower"
                        transform="translate(65 70) rotate(23 400 230)"
                    />

                    <!-- fallen left deck -->
                    <use
                        href="#leftDeck"
                        transform="translate(-15 65) rotate(-12 90 230)"
                    />

                    <!-- fallen center deck -->
                    <use
                        href="#centerDeck"
                        transform="translate(0 85) rotate(7 275 230)"
                    />

                    <!-- fallen right deck -->
                    <use
                        href="#rightDeck"
                        transform="translate(20 95) rotate(13 480 230)"
                    />

                </g>


                <!-- =====================================================
                    MISTAKE 6 — COMPLETE COLLAPSE / RUBBLE
                    ===================================================== -->
                <g id="mistake6" style="display:none">

                    <!-- fallen left deck -->
                    <use
                        href="#leftDeck"
                        transform="translate(-45 105) rotate(-18 90 230)"
                    />

                    <!-- fallen center deck -->
                    <use
                        href="#centerDeck"
                        transform="translate(-15 115) rotate(9 275 230)"
                    />

                    <!-- fallen right deck -->
                    <use
                        href="#rightDeck"
                        transform="translate(35 110) rotate(-14 480 230)"
                    />

                    <!-- broken left tower pieces -->
                    <use
                        href="#leftTower"
                        transform="translate(-90 130) rotate(-38 200 230)"
                    />

                    <!-- broken right tower pieces -->
                    <use
                        href="#rightTower"
                        transform="translate(80 135) rotate(35 400 230)"
                    />

                    <!-- extra rubble -->
                    <line x1="60" y1="350" x2="145" y2="330"
                        stroke="currentColor" stroke-width="5"/>

                    <line x1="150" y1="355" x2="225" y2="335"
                        stroke="currentColor" stroke-width="4"/>

                    <line x1="245" y1="355" x2="315" y2="335"
                        stroke="currentColor" stroke-width="5"/>

                    <line x1="330" y1="355" x2="410" y2="332"
                        stroke="currentColor" stroke-width="4"/>

                    <line x1="420" y1="350" x2="515" y2="330"
                        stroke="currentColor" stroke-width="5"/>

                    <line x1="100" y1="340" x2="175" y2="350"
                        stroke="currentColor" stroke-width="3"/>

                    <line x1="285" y1="342" x2="360" y2="352"
                        stroke="currentColor" stroke-width="3"/>

                </g>

            </svg>

        </div>

    </div>


    <script>

        let words = [
            "gear",
            "piston",
            "turbine",
            "circuit",
            "motor",
            "bearing",
            "valve",
            "pump",
            "shaft",
            "lever",
            "pulley",
            "sensor",
            "actuator",
            "rotor",
            "propeller",
            "compressor",
            "hydraulic",
            "blueprint",
            "welding",
            "spring",
            "beam",
            "bolt",
            "frame",
            "nozzle",
            "dynamo",
            "girder",
            "robot",
            "fuse",
            "engine",
            "battery"
        ];

        let desc = [
            "A toothed wheel that transfers motion.",
            "A moving part found inside many engines.",
            "A machine that uses moving fluid or gas to produce energy.",
            "A path through which electricity flows.",
            "A machine that converts energy into motion.",
            "A component that reduces friction between moving parts.",
            "A device that controls the flow of a fluid or gas.",
            "A machine used to move liquids or gases.",
            "A rotating part that transfers mechanical power.",
            "A bar used to multiply or change the direction of force.",
            "A wheel used with a rope or belt to move loads.",
            "A device that detects changes in its surroundings.",
            "A device that creates physical movement.",
            "A rotating component of a machine.",
            "Rotating blades that produce thrust.",
            "A machine that increases the pressure of a gas.",
            "A system that uses pressurized liquid to create force.",
            "A technical drawing used to plan a structure or machine.",
            "A process used to permanently join pieces of metal.",
            "A component that stores mechanical energy.",
            "A structural element designed to carry loads.",
            "A threaded fastener used to hold parts together.",
            "A structure that supports the parts of a machine or vehicle.",
            "An opening that directs the flow of a fluid or gas.",
            "A machine that converts mechanical energy into electricity.",
            "A large beam used to support heavy structures.",
            "A programmable machine that performs tasks automatically.",
            "A safety device that protects an electrical circuit from excessive current.",
            "A machine that converts energy into mechanical work.",
            "A device that stores and supplies electrical energy."
        ];

        let randomwords = words[Math.floor(Math.random() * words.length)];

        let displayword = "_ ".repeat(randomwords.length).split(" ");

        document.querySelector("#guessword").textContent = displayword.join(" ");

        let gameover = false;

        let wrongguesses = "";

        let attempts = 6;

        document.querySelector("#attempts").textContent = "Attempts Left: " + attempts;

        for (let i = 1; i <= 6; i++)
        {
            document.querySelector("#mistake" + i).style.display = "none";
        }

        document.querySelector("#guessbutton").addEventListener("click", function()
        {

            if (gameover == false)
            {
                let guessletter = document.querySelector("#input").value.toLowerCase();

                if (guessletter.length != 1)
                {
                    document.querySelector("#input").value = "";
                    alert("Please enter only a single letter.");
                    return;
                }

                if (guessletter < "a" || guessletter > "z")
                {
                    document.querySelector("#input").value = "";
                    alert("Please enter a valid letter.");
                    return;
                }

                if (displayword.includes(guessletter) || wrongguesses.includes(guessletter))
                {
                    document.querySelector("#input").value = "";
                    alert("You have already guessed this letter. Please try a different one.");
                    return;
                }

                let correct = false;

                for (let i = 0; i < randomwords.length; i++)
                {
                    if (guessletter == randomwords[i])
                    {
                        displayword[i] = guessletter;
                        correct = true;
                    }
                }

                document.querySelector("#guessword").textContent = displayword.join(" ");

                if (!correct)
                {
                    wrongguesses += guessletter + " ";

                    attempts--;

                    document.querySelector("#wrongguess").textContent =
                        "Wrong Guesses: " + wrongguesses;

                    document.querySelector("#attempts").textContent =
                        "Attempts Left: " + attempts;

                    let mistakes = 6 - attempts;

                    document.querySelector("#bridgeStart").style.display = "none";

                    for (let i = 1; i <= 6; i++)
                    {
                        document.querySelector("#mistake" + i).style.display = "none";
                    }

                    document.querySelector("#mistake" + mistakes).style.display = "block";
                }

                if (!(displayword.join("").includes("_")))
                {
                    document.querySelector("#result").textContent =
                        "Congratulations! You won!";

                    document.querySelector("#description").textContent +=
                        desc[words.indexOf(randomwords)];

                    gameover = true;

                    document.querySelector("#input").disabled = true;
                    document.querySelector("#guessbutton").disabled = true;
                }

                if (attempts == 0)
                {
                    document.querySelector("#result").textContent =
                        "Game Over! You lost. The word was " + randomwords + ".";

                    document.querySelector("#description").textContent +=
                        desc[words.indexOf(randomwords)];

                    gameover = true;

                    document.querySelector("#input").disabled = true;
                    document.querySelector("#guessbutton").disabled = true;
                }

                document.querySelector("#input").value = "";
            }

        });

        document.querySelector("#restartbutton").addEventListener("click", function()
        {
            document.querySelector("#input").disabled = false;
            document.querySelector("#guessbutton").disabled = false;

            document.querySelector("#wrongguess").textContent = "Wrong Guesses: ";
            document.querySelector("#description").textContent = "Description: ";
            attempts = 6;
            document.querySelector("#attempts").textContent = "Attempts Left: " + attempts;
            document.querySelector("#result").textContent = "Result: ";

            randomwords = words[Math.floor(Math.random() * words.length)];

            displayword = "_ ".repeat(randomwords.length).split(" ");

            gameover = false;

            wrongguesses = "";

            document.querySelector("#guessword").textContent = displayword.join(" ");

            document.querySelector("#bridgeStart").style.display = "block";

            for (let i = 1; i <= 6; i++)
            {
                document.querySelector("#mistake" + i).style.display = "none";
            }
        });

    </script>

</body>
</html>
